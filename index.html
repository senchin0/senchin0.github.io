<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GitHub 文件管理器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI,sans-serif}
body{background:#12141d;color:#e2e8f0;height:100vh;display:flex;overflow:hidden}
/* 侧边目录树 */
#sidebar{width:260px;background:#1a1d29;border-right:1px solid #2d303b;display:flex;flex-direction:column}
.sidebar-head{padding:14px;border-bottom:1px solid #2d303b;font-weight:bold;color:#94a3b8;display:flex;justify-content:space-between;align-items:center}
#tree-wrap{flex:1;overflow:auto;padding:8px}
.tree-node{padding:5px 6px;margin:2px 0;border-radius:4px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px}
.tree-node:hover{background:#272b38}
.tree-node.active{background:#253452;color:#60a5fa}
.tree-indent{margin-left:16px}
.folder-icon{color:#facc15}
.file-icon{color:#94a3b8}
/* 主区域 */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* 顶部工具栏 */
.toolbar{padding:10px 12px;background:#1a1d29;border-bottom:1px solid #2d303b;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 12px;border-radius:5px;border:none;font-size:14px;cursor:pointer;background:#272b38;color:#e2e8f0;display:inline-flex;align-items:center;gap:4px}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-primary{background:#238636}
.btn-danger{background:#b91c1c}
.btn:hover{filter:brightness(1.1)}
.breadcrumb{padding:8px 12px;background:#12141d;border-bottom:1px solid #2d303b;font-family:monospace;color:#94a3b8;font-size:13px}
.breadcrumb a{color:#60a5fa;text-decoration:none;margin:0 4px}
/* 文件列表 */
.list-container{flex:1;overflow:auto}
.table-head{display:grid;grid-template-columns:36px 1fr 90px;padding:8px 12px;background:#1a1d29;border-bottom:1px solid #2d303b;font-size:13px;color:#94a3b8}
.file-row{display:grid;grid-template-columns:36px 1fr 90px;padding:10px 12px;border-bottom:1px solid #20232e;align-items:center;cursor:pointer}
.file-row:hover{background:#1a1d29}
.file-row.selected{background:#20293f}
.file-name{display:flex;align-items:center;gap:8px}
.file-size{text-align:right;color:#94a3b8;font-size:12px}
.checkbox{width:18px;height:18px;cursor:pointer}
/* 上传区域 */
.dropzone{margin:12px;border:2px dashed #2d303b;border-radius:6px;text-align:center;padding:30px;color:#64748b}
.dropzone.drag{border-color:#60a5fa;background:rgba(96,165,250,0.08)}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:99}
.modal-box{background:#1a1d29;border:1px solid #2d303b;border-radius:8px;padding:20px;width:min(90%,400px)}
.modal-box h4{margin-bottom:14px}
.modal-box input{width:100%;padding:9px;border-radius:5px;background:#12141d;border:1px solid #2d303b;color:#fff;margin:8px 0}
.modal-buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* 登录面板 */
#login{position:fixed;inset:0;background:#12141d;display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{background:#1a1d29;border:1px solid #2d303b;padding:24px;border-radius:8px;width:min(92%,360px)}
.login-card input{width:100%;padding:10px;margin:7px 0;background:#12141d;border:1px solid #2d303b;border-radius:6px;color:#fff}
/* 底部状态栏 */
.status-bar{padding:6px 12px;background:#1a1d29;border-top:1px solid #2d303b;font-size:12px;color:#94a3b8}
/* 移动端侧边栏开关 */
@media (max-width:768px){
  #sidebar{position:absolute;z-index:9;width:260px;transform:translateX(-100%);transition:0.2s}
  #sidebar.open{transform:translateX(0)}
}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <h3>🔐 仓库授权</h3>
    <input placeholder="用户名(owner)" id="owner">
    <input placeholder="仓库名(repo)" id="repo">
    <input placeholder="Fine-grained Token" type="password" id="token">
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()">进入管理器</button>
  </div>
</div>

<div id="sidebar">
  <div class="sidebar-head">
    <span>📁 目录树</span>
    <button class="btn" onclick="toggleSidebar()" style="padding:3px 6px">≡</button>
  </div>
  <div id="tree-wrap"></div>
</div>

<div id="main">
  <div class="toolbar">
    <button class="btn" id="btnBack" onclick="goParent()" disabled>⬆ 返回上级</button>
    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📤 上传</button>
    <input type="file" id="fileInput" multiple style="display:none" onchange="uploadFiles(this.files)">
    <button class="btn" onclick="newFolder()">📂 新建文件夹</button>
    <button class="btn" id="btnRename" disabled onclick="openRename()">✏️ 重命名</button>
    <button class="btn" id="btnMove" disabled onclick="openMove()">➡️ 移动</button>
    <button class="btn" id="btnCopy" disabled onclick="copySelected()">📋 复制</button>
    <button class="btn btn-danger" id="btnDel" disabled onclick="batchDelete()">🗑️ 删除选中</button>
    <button class="btn" onclick="refreshAll()">🔄 刷新</button>
    <button class="btn" style="margin-left:auto" onclick="logout()">🚪退出</button>
  </div>
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="list-container">
    <div class="table-head">
      <input type="checkbox" class="checkbox" id="checkAll">
      <div>文件名</div>
      <div>大小</div>
    </div>
    <div id="fileList"></div>
    <div class="dropzone" id="dropZone">拖拽文件到此上传</div>
  </div>
  <div class="status-bar" id="status">就绪</div>
</div>

<!-- 弹窗 -->
<div class="modal" id="modalRename">
  <div class="modal-box">
    <h4>重命名 / 移动路径</h4>
    <input id="renameInput">
    <div class="modal-buttons">
      <button class="btn" onclick="closeModal('modalRename')">取消</button>
      <button class="btn btn-primary" onclick="submitRename()">确认</button>
    </div>
  </div>
</div>
<div class="modal" id="modalFolder">
  <div class="modal-box">
    <h4>新建文件夹</h4>
    <input placeholder="文件夹名称" id="folderInput">
    <div class="modal-buttons">
      <button class="btn" onclick="closeModal('modalFolder')">取消</button>
      <button class="btn btn-primary" onclick="submitFolder()">创建</button>
    </div>
  </div>
</div>

<script>
let config = {token:'',owner:'',repo:''};
let currentPath = '';
let selectedItems = new Set();
let treeData = {};
let activeFile = null;
const API = 'https://api.github.com';

// 初始化读取本地存储
window.onload = ()=>{
  let save = JSON.parse(localStorage.getItem('gmCfg')||'{}');
  if(save.token){
    config = save;
    document.getElementById('login').style.display = 'none';
    renderTree();
    loadDir('');
  }
  // 全选框
  document.getElementById('checkAll').onchange = (e)=>{
    let boxes = document.querySelectorAll('.rowCheck');
    boxes.forEach(b=>b.checked = e.target.checked);
    syncSelect();
  };
  // 拖拽
  let dz = document.getElementById('dropZone');
  dz.ondragover = e=>{e.preventDefault();dz.classList.add('drag')};
  dz.ondragleave = ()=>dz.classList.remove('drag');
  dz.ondrop = e=>{
    e.preventDefault();dz.classList.remove('drag');
    uploadFiles(e.dataTransfer.files);
  };
};

function doLogin(){
  config.owner = document.getElementById('owner').value.trim();
  config.repo = document.getElementById('repo').value.trim();
  config.token = document.getElementById('token').value.trim();
  if(!config.owner||!config.repo||!config.token)return alert('填写完整');
  localStorage.setItem('gmCfg',JSON.stringify(config));
  document.getElementById('login').style.display = 'none';
  renderTree();
  loadDir('');
}
function logout(){localStorage.removeItem('gmCfg');location.reload()}
function setStatus(text){document.getElementById('status').innerText = text}
async function api(path,opts={}){
  let headers = {Authorization:`Bearer ${config.token}`,'Accept':'application/vnd.github.v3+json'};
  let res = await fetch(`${API}/repos/${config.owner}/${config.repo}/contents/${path}`,{headers,...opts});
  if(res.status===401){alert('Token无效');logout()}
  if(res.status===404)return null;
  let json = await res.json();
  return json;
}

// 左侧目录树
async function renderTree(){
  setStatus('加载目录树...');
  try{
    let res = await fetch(`${API}/repos/${config.owner}/${config.repo}/git/trees/main?recursive=1`,{headers:{Authorization:`Bearer ${config.token}`}});
    let data = await res.json();
    treeData = {};
    data.tree.forEach(item=>{
      let p = item.path.split('/');
      let cur = treeData;
      p.forEach((name,i)=>{
        if(!cur[name]) cur[name]={type:item.type,children:{}};
        cur = cur[name].children;
      });
    });
    let wrap = document.getElementById('tree-wrap');
    wrap.innerHTML = '';
    drawTree(treeData,wrap,'');
    setStatus('目录加载完成');
  }catch(e){setStatus('目录树加载失败');}
}
function drawTree(obj,parent,basePath,level=0){
  let keys = Object.keys(obj).sort((a,b)=>{
    if(obj[a].type==='tree'&&obj[b].type!=='tree')return -1;
    if(obj[a].type!=='tree'&&obj[b].type==='tree')return 1;
    return a.localeCompare(b);
  });
  keys.forEach(name=>{
    let fullPath = basePath?`${basePath}/${name}`:name;
    let div = document.createElement('div');
    div.className = 'tree-node';
    div.style.paddingLeft = (level*12)+'px';
    div.innerHTML = obj[name].type==='tree'?`<span class="folder-icon">📁</span>${name}`:`<span class="file-icon">📄</span>${name}`;
    if(obj[name].type==='tree') div.onclick=()=>{document.querySelectorAll('.tree-node').forEach(n=>n.classList.remove('active'));div.classList.add('active');loadDir(fullPath)};
    parent.appendChild(div);
    if(obj[name].type==='tree') drawTree(obj[name].children,parent,fullPath,level+1);
  });
}

// 加载当前目录
async function loadDir(path){
  currentPath = path;
  selectedItems.clear();syncSelect();
  document.getElementById('checkAll').checked=false;
  document.getElementById('btnBack').disabled = path==='';
  // 面包屑
  let bc = document.getElementById('breadcrumb');
  let parts = path.split('/').filter(x=>x);
  let bcHtml = `<a href="#" onclick="loadDir('')">/</a>`;
  let tmp = '';
  parts.forEach(p=>{tmp+=`/${p}`;bcHtml+=`<a href="#" onclick="loadDir('${tmp.slice(1)}')">${p}</a>/`});
  bc.innerHTML = bcHtml;

  setStatus(`读取目录: ${path||'根目录'}`);
  let list = await api(path||'');
  let listEl = document.getElementById('fileList');
  listEl.innerHTML = '';
  if(!Array.isArray(list))return;
  list.sort((a,b)=>{
    if(a.type==='dir'&&b.type!=='dir')return -1;
    if(a.type!=='dir'&&b.type==='dir')return 1;
    return a.name.localeCompare(b.name);
  });
  list.forEach(item=>{
    let row = document.createElement('div');
    row.className = 'file-row';
    row.dataset.path = item.path;
    let icon = item.type==='dir'?'📁':'📄';
    row.innerHTML = `
      <input type="checkbox" class="checkbox rowCheck">
      <div class="file-name">${icon} ${item.name}</div>
      <div class="file-size">${item.type==='dir'?'-':formatSize(item.size)}</div>
    `;
    row.querySelector('.rowCheck').onchange = (e)=>{
      e.stopPropagation();
      if(e.target.checked) selectedItems.add(item.path);
      else selectedItems.delete(item.path);
      syncSelect();
    };
    row.onclick=(e)=>{
      if(e.target.classList.contains('rowCheck'))return;
      activeFile = item.path;
      document.querySelectorAll('.file-row').forEach(r=>r.classList.remove('selected'));
      row.classList.add('selected');
      syncSelect();
      if(item.type==='dir') loadDir(item.path);
    };
    listEl.appendChild(row);
  });
}
function syncSelect(){
  let hasSel = selectedItems.size>0;
  document.getElementById('btnRename').disabled = !hasSel||selectedItems.size>1;
  document.getElementById('btnMove').disabled = !hasSel;
  document.getElementById('btnCopy').disabled = !hasSel;
  document.getElementById('btnDel').disabled = !hasSel;
}
function goParent(){
  let arr = currentPath.split('/').filter(x=>x);
  arr.pop();
  loadDir(arr.join('/'));
}
function refreshAll(){renderTree();loadDir(currentPath)}

// 上传文件
async function uploadFiles(files){
  for(let f of files){
    await uploadOne(f);
  }
  renderTree();loadDir(currentPath);
}
async function uploadOne(file){
  let p = currentPath?`${currentPath}/${file.name}`:file.name;
  setStatus(`上传: ${file.name}`);
  let reader = new FileReader();
  let b64 = await new Promise(res=>{
    reader.onload=e=>res(e.target.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
  let exist = await api(p);
  await api(p,{method:'PUT',body:JSON.stringify({message:`上传 ${file.name}`,content:b64,sha:exist?.sha})});
  setStatus(`${file.name} 上传完成`);
}

// 新建文件夹
function newFolder(){
  document.getElementById('folderInput').value='';
  document.getElementById('modalFolder').style.display='flex';
}
async function submitFolder(){
  let name = document.getElementById('folderInput').value.trim();
  if(!name)return;
  let p = currentPath?`${currentPath}/${name}/.gitkeep`:`${name}/.gitkeep`;
  await api(p,{method:'PUT',body:JSON.stringify({message:`新建文件夹 ${name}`,content:btoa('')})});
  closeModal('modalFolder');
  renderTree();loadDir(currentPath);
}

// 重命名移动
function openRename(){
  document.getElementById('renameInput').value = activeFile;
  document.getElementById('modalRename').style.display='flex';
}
function openMove(){
  document.getElementById('renameInput').value = activeFile;
  document.getElementById('modalRename').style.display='flex';
}
async function submitRename(){
  let newPath = document.getElementById('renameInput').value.trim();
  let old = activeFile;
  let data = await api(old);
  await api(newPath,{method:'PUT',body:JSON.stringify({message:`移动 ${old} → ${newPath}`,content:data.content})});
  await api(old,{method:'DELETE',body:JSON.stringify({message:'删除原文件',sha:data.sha})});
  closeModal('modalRename');
  renderTree();loadDir(currentPath);
}

// 复制选中
async function copySelected(){
  for(let p of selectedItems){
    let data = await api(p);
    let newP = p+'.copy';
    await api(newP,{method:'PUT',body:JSON.stringify({message:`复制 ${p}`,content:data.content})});
  }
  renderTree();loadDir(currentPath);
}

// 批量删除
async function batchDelete(){
  if(!confirm('确定删除选中文件？'))return;
  for(let p of selectedItems){
    let f = await api(p);
    await api(p,{method:'DELETE',body:JSON.stringify({message:'批量删除',sha:f.sha})});
  }
  renderTree();loadDir(currentPath);
}

function closeModal(id){document.getElementById(id).style.display='none'}
function formatSize(b){
  if(b<1024)return b+'B';
  if(b<1048576)return (b/1024).toFixed(1)+'KB';
  return (b/1048576).toFixed(1)+'MB';
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
</script>
</body>
</html>
