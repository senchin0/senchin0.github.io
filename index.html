<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 仓库文件管理器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#0d1117;color:#c9d1d9;display:flex;height:100vh}
/* 登录面板 */
#login-panel{position:fixed;inset:0;background:#161b22;display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:32px;width:380px}
.login-box h2{margin-bottom:20px;color:#58a6ff}
.login-box input{width:100%;padding:10px;margin:8px 0;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9}
.login-box button{width:100%;padding:10px;margin-top:12px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.login-box button:hover{background:#2ea043}
/* 侧边栏目录树 */
#sidebar{width:280px;background:#161b22;border-right:1px solid #30363d;overflow-y:auto;padding:12px}
#sidebar h3{padding:8px;color:#8b949e;font-size:13px;text-transform:uppercase}
.tree-item{padding:6px 8px;cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:6px;font-size:14px}
.tree-item:hover{background:#21262d}
.tree-item.active{background:#1f6feb33;color:#58a6ff}
.folder-icon{color:#d29922}
.file-icon{color:#8b949e}
/* 主内容区 */
#main{flex:1;display:flex;flex-direction:column}
#toolbar{padding:12px;background:#161b22;border-bottom:1px solid #30363d;display:flex;gap:8px;align-items:center}
.btn{padding:6px 14px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{background:#30363d}
.btn-primary{background:#238636;border-color:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-danger{background:#da3633;border-color:#da3633;color:#fff}
#path-bar{padding:8px 12px;background:#0d1117;border-bottom:1px solid #30363d;font-family:monospace;color:#8b949e;font-size:13px}
#file-list{flex:1;overflow-y:auto;padding:8px}
.file-row{display:flex;align-items:center;padding:8px 12px;border-radius:6px;cursor:pointer;gap:12px}
.file-row:hover{background:#161b22}
.file-row .name{flex:1}
.file-row .size{color:#8b949e;font-size:12px;width:80px;text-align:right}
/* 上传区域 */
#drop-zone{border:2px dashed #30363d;border-radius:8px;padding:40px;text-align:center;margin:12px;color:#8b949e}
#drop-zone.drag-over{border-color:#58a6ff;background:#1f6feb11}
/* 模态框 */
.modal{position:fixed;inset:0;background:#00000088;display:none;align-items:center;justify-content:center;z-index:50}
.modal-box{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:24px;min-width:320px}
.modal-box h3{margin-bottom:16px}
.modal-box input{width:100%;padding:8px;margin:8px 0;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#status-bar{padding:6px 12px;background:#161b22;border-top:1px solid #30363d;font-size:12px;color:#8b949e}
</style>
</head>
<body>

<!-- 登录面板 -->
<div id="login-panel">
  <div class="login-box">
    <h2>🔐 仓库文件管理器登录</h2>
    <input type="text" id="owner-input" placeholder="仓库所有者用户名 (如 UserB)">
    <input type="text" id="repo-input" placeholder="仓库名 (如 blog-repo)">
    <input type="password" id="token-input" placeholder="GitHub Personal Access Token">
    <button onclick="login()">进入管理系统</button>
    <p style="margin-top:12px;font-size:12px;color:#8b949e;text-align:center">
      Token 仅保存在本地浏览器，不会上传
    </p>
  </div>
</div>

<!-- 侧边栏目录树 -->
<div id="sidebar" style="display:none">
  <h3>📁 目录树</h3>
  <div id="tree-container"></div>
</div>

<!-- 主区域 -->
<div id="main" style="display:none">
  <div id="toolbar">
    <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">📤 上传文件</button>
    <input type="file" id="file-input" style="display:none" multiple onchange="handleUpload(event)">
    <button class="btn" onclick="showNewFolderModal()">📁 新建文件夹</button>
    <button class="btn" onclick="refresh()">🔄 刷新</button>
    <button class="btn" onclick="logout()" style="margin-left:auto">🚪 退出</button>
  </div>
  <div id="path-bar">/</div>
  <div id="file-list">
    <div id="drop-zone">
      📂 拖拽文件到此处上传<br>
      <span style="font-size:12px">支持图片、视频、代码等任意格式</span>
    </div>
  </div>
  <div id="status-bar">就绪</div>
</div>

<!-- 重命名模态框 -->
<div class="modal" id="rename-modal">
  <div class="modal-box">
    <h3>重命名 / 移动</h3>
    <p style="font-size:12px;color:#8b949e;margin-bottom:8px">输入新路径（含文件名）可移动到其他目录</p>
    <input type="text" id="rename-input">
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('rename-modal')">取消</button>
      <button class="btn btn-primary" onclick="doRename()">确认</button>
    </div>
  </div>
</div>

<!-- 新建文件夹模态框 -->
<div class="modal" id="folder-modal">
  <div class="modal-box">
    <h3>新建文件夹</h3>
    <input type="text" id="folder-input" placeholder="文件夹名称">
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('folder-modal')">取消</button>
      <button class="btn btn-primary" onclick="createFolder()">创建</button>
    </div>
  </div>
</div>

<script>
let GITHUB_TOKEN = '';
let REPO_OWNER = '';
let REPO_NAME = '';
let CURRENT_PATH = '';
let SELECTED_FILE = null;
let fileTree = {};

const API_BASE = 'https://api.github.com';

// ========== 登录逻辑 ==========
function login() {
  REPO_OWNER = document.getElementById('owner-input').value.trim();
  REPO_NAME = document.getElementById('repo-input').value.trim();
  GITHUB_TOKEN = document.getElementById('token-input').value.trim();
  
  if (!REPO_OWNER || !REPO_NAME || !GITHUB_TOKEN) {
    alert('请填写完整信息');
    return;
  }
  
  // 保存到 localStorage
  localStorage.setItem('gm_owner', REPO_OWNER);
  localStorage.setItem('gm_repo', REPO_NAME);
  localStorage.setItem('gm_token', GITHUB_TOKEN);
  
  showApp();
  loadTree();
  loadDirectory('');
}

function logout() {
  localStorage.removeItem('gm_token');
  location.reload();
}

function showApp() {
  document.getElementById('login-panel').style.display = 'none';
  document.getElementById('sidebar').style.display = 'block';
  document.getElementById('main').style.display = 'flex';
}

// 自动填充已保存的信息
window.onload = () => {
  const savedOwner = localStorage.getItem('gm_owner');
  const savedRepo = localStorage.getItem('gm_repo');
  const savedToken = localStorage.getItem('gm_token');
  if (savedOwner) document.getElementById('owner-input').value = savedOwner;
  if (savedRepo) document.getElementById('repo-input').value = savedRepo;
  if (savedToken) document.getElementById('token-input').value = savedToken;
  
  // 拖拽上传
  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    uploadFiles(e.dataTransfer.files);
  });
};

// ========== GitHub API 封装 ==========
async function api(path, options = {}) {
  const res = await fetch(`${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
    ...options,
    headers: {
      'Authorization': `Bearer ${GITHUB_TOKEN}`,
      'Accept': 'application/vnd.github.v3+json',
      ...options.headers
    }
  });
  
  if (res.status === 401) {
    alert('Token 无效或已过期');
    logout();
    return null;
  }
  if (res.status === 404) return null;
  if (!res.ok) {
    const err = await res.json();
    setStatus(`错误: ${err.message}`);
    throw new Error(err.message);
  }
  return res.json();
}

// ========== 目录树加载 ==========
async function loadTree() {
  setStatus('加载目录树中...');
  try {
    // 使用 git tree API 递归获取完整目录结构
    const res = await fetch(`${API_BASE}/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/main?recursive=1`, {
      headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
    });
    const data = await res.json();
    
    fileTree = {};
    if (data.tree) {
      data.tree.forEach(item => {
        const parts = item.path.split('/');
        let current = fileTree;
        parts.forEach((part, i) => {
          if (!current[part]) {
            current[part] = { _type: i === parts.length - 1 ? item.type : 'tree', _children: {} };
          }
          current = current[part]._children;
        });
      });
    }
    renderTree();
    setStatus('目录树加载完成');
  } catch (e) {
    setStatus('目录树加载失败: ' + e.message);
  }
}

function renderTree() {
  const container = document.getElementById('tree-container');
  container.innerHTML = '';
  renderTreeNode(fileTree, container, '');
}

function renderTreeNode(node, parentEl, path) {
  Object.keys(node).sort((a, b) => {
    const aIsTree = node[a]._type === 'tree';
    const bIsTree = node[b]._type === 'tree';
    if (aIsTree && !bIsTree) return -1;
    if (!aIsTree && bIsTree) return 1;
    return a.localeCompare(b);
  }).forEach(name => {
    const item = node[name];
    const fullPath = path ? `${path}/${name}` : name;
    
    const div = document.createElement('div');
    div.className = 'tree-item';
    div.innerHTML = item._type === 'tree' 
      ? '<span class="folder-icon">📁</span>' + name
      : '<span class="file-icon">📄</span>' + name;
    
    if (item._type === 'tree') {
      div.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
        div.classList.add('active');
        loadDirectory(fullPath);
      };
    }
    
    parentEl.appendChild(div);
    
    if (item._type === 'tree' && Object.keys(item._children).length > 0) {
      const childContainer = document.createElement('div');
      childContainer.style.paddingLeft = '16px';
      parentEl.appendChild(childContainer);
      renderTreeNode(item._children, childContainer, fullPath);
    }
  });
}

// ========== 目录内容加载 ==========
async function loadDirectory(path) {
  CURRENT_PATH = path;
  document.getElementById('path-bar').textContent = '/' + path;
  setStatus(`加载目录: ${path || '根目录'}`);
  
  try {
    const data = await api(path || '') || [];
    const listEl = document.getElementById('file-list');
    
    if (!Array.isArray(data)) {
      // 是文件，预览
      listEl.innerHTML = `<div style="padding:20px">
        <h3>${data.name}</h3>
        <p style="color:#8b949e;margin:8px 0">大小: ${formatSize(data.size)}</p>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn" onclick="downloadFile('${data.path}')">下载</button>
          <button class="btn" onclick="showRenameModal('${data.path}')">重命名/移动</button>
          <button class="btn" onclick="copyFile('${data.path}')">复制</button>
          <button class="btn btn-danger" onclick="deleteFile('${data.path}')">删除</button>
        </div>
      </div>`;
      return;
    }
    
    // 排序：文件夹在前
    data.sort((a, b) => {
      if (a.type === 'dir' && b.type !== 'dir') return -1;
      if (a.type !== 'dir' && b.type === 'dir') return 1;
      return a.name.localeCompare(b.name);
    });
    
    let html = '';
    // 返回上级
    if (path) {
      const parentPath = path.split('/').slice(0, -1).join('/');
      html += `<div class="file-row" onclick="loadDirectory('${parentPath}')">
        <span>⬆️</span><span class="name">.. 返回上级</span><span class="size"></span>
      </div>`;
    }
    
    data.forEach(item => {
      const icon = item.type === 'dir' ? '📁' : '📄';
      html += `<div class="file-row" onclick="${item.type === 'dir' ? `loadDirectory('${item.path}')` : `loadDirectory('${item.path}')`}">
        <span>${icon}</span>
        <span class="name">${item.name}</span>
        <span class="size">${item.type === 'dir' ? '-' : formatSize(item.size)}</span>
      </div>`;
    });
    
    listEl.innerHTML = html + '<div id="drop-zone" style="margin-top:16px">📂 拖拽文件到此处上传</div>';
    
    // 重新绑定拖拽
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      uploadFiles(e.dataTransfer.files);
    });
    
    setStatus(`共 ${data.length} 项`);
  } catch (e) {
    setStatus('加载失败: ' + e.message);
  }
}

// ========== 文件上传 ==========
function handleUpload(e) {
  uploadFiles(e.target.files);
  e.target.value = '';
}

async function uploadFiles(files) {
  for (const file of files) {
    await uploadSingleFile(file);
  }
  loadTree();
  loadDirectory(CURRENT_PATH);
}

async function uploadSingleFile(file) {
  const targetPath = CURRENT_PATH ? `${CURRENT_PATH}/${file.name}` : file.name;
  setStatus(`正在上传: ${file.name}`);
  
  try {
    // 读取文件并转 base64
    const content = await fileToBase64(file);
    
    // 检查文件是否已存在
    const existing = await api(targetPath);
    const sha = existing ? existing.sha : undefined;
    
    await api(targetPath, {
      method: 'PUT',
      body: JSON.stringify({
        message: `上传文件: ${file.name}`,
        content: content,
        sha: sha
      })
    });
    
    setStatus(`✓ ${file.name} 上传成功`);
  } catch (e) {
    setStatus(`✗ ${file.name} 上传失败: ${e.message}`);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      // 去掉 data:application/...;base64, 前缀
      const base64 = reader.result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ========== 文件删除 ==========
async function deleteFile(path) {
  if (!confirm(`确定删除 ${path} ?`)) return;
  
  try {
    const fileInfo = await api(path);
    if (!fileInfo) return;
    
    await api(path, {
      method: 'DELETE',
      body: JSON.stringify({
        message: `删除文件: ${path.split('/').pop()}`,
        sha: fileInfo.sha
      })
    });
    
    setStatus('✓ 删除成功');
    loadTree();
    loadDirectory(CURRENT_PATH);
  } catch (e) {
    setStatus('删除失败: ' + e.message);
  }
}

// ========== 重命名 / 移动 ==========
function showRenameModal(path) {
  SELECTED_FILE = path;
  document.getElementById('rename-input').value = path;
  document.getElementById('rename-modal').style.display = 'flex';
}

async function doRename() {
  const newPath = document.getElementById('rename-input').value.trim();
  if (!newPath || newPath === SELECTED_FILE) {
    closeModal('rename-modal');
    return;
  }
  
  try {
    setStatus('正在移动文件...');
    // 读取原文件
    const oldFile = await api(SELECTED_FILE);
    if (!oldFile) return;
    
    // 写入新路径
    await api(newPath, {
      method: 'PUT',
      body: JSON.stringify({
        message: `移动: ${SELECTED_FILE} → ${newPath}`,
        content: oldFile.content
      })
    });
    
    // 删除原文件
    await api(SELECTED_FILE, {
      method: 'DELETE',
      body: JSON.stringify({
        message: `删除原文件: ${SELECTED_FILE}`,
        sha: oldFile.sha
      })
    });
    
    setStatus('✓ 移动成功');
    closeModal('rename-modal');
    loadTree();
    loadDirectory(CURRENT_PATH);
  } catch (e) {
    setStatus('移动失败: ' + e.message);
  }
}

// ========== 复制文件 ==========
async function copyFile(path) {
  const newName = prompt('输入新文件路径（复制到）', path + '.copy');
  if (!newName) return;
  
  try {
    setStatus('正在复制...');
    const oldFile = await api(path);
    if (!oldFile) return;
    
    await api(newName, {
      method: 'PUT',
      body: JSON.stringify({
        message: `复制: ${path} → ${newName}`,
        content: oldFile.content
      })
    });
    
    setStatus('✓ 复制成功');
    loadTree();
    loadDirectory(CURRENT_PATH);
  } catch (e) {
    setStatus('复制失败: ' + e.message);
  }
}

// ========== 新建文件夹 ==========
function showNewFolderModal() {
  document.getElementById('folder-input').value = '';
  document.getElementById('folder-modal').style.display = 'flex';
}

async function createFolder() {
  const name = document.getElementById('folder-input').value.trim();
  if (!name) return;
  
  // GitHub 不能直接创建空文件夹，创建一个 .gitkeep 占位文件
  const folderPath = CURRENT_PATH ? `${CURRENT_PATH}/${name}/.gitkeep` : `${name}/.gitkeep`;
  
  try {
    await api(folderPath, {
      method: 'PUT',
      body: JSON.stringify({
        message: `创建文件夹: ${name}`,
        content: btoa('')
      })
    });
    
    setStatus('✓ 文件夹创建成功');
    closeModal('folder-modal');
    loadTree();
    loadDirectory(CURRENT_PATH);
  } catch (e) {
    setStatus('创建失败: ' + e.message);
  }
}

// ========== 下载文件 ==========
function downloadFile(path) {
  window.open(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${path}`);
}

// ========== 工具函数 ==========
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
  return (bytes / 1073741824).toFixed(2) + ' GB';
}

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}

function refresh() {
  loadTree();
  loadDirectory(CURRENT_PATH);
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

// 点击模态框背景关闭
document.querySelectorAll('.modal').forEach(modal => {
  modal.addEventListener('click', e => {
    if (e.target === modal) modal.style.display = 'none';
  });
});
</script>
</body>
</html>
